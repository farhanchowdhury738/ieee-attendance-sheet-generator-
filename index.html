<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IEEE AIUB Attendance Sheet Generator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Word (.docx) library -->
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="min-h-screen bg-slate-100 text-slate-900">
    <div
      class="no-print sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur"
    >
      <div
        class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4"
      >
        <div>
          <h1 class="text-xl font-bold text-slate-900">
            IEEE AIUB Attendance Sheet
          </h1>
        </div>
      </div>
    </div>

    <main
      class="mx-auto grid max-w-7xl grid-cols-1 gap-6 px-5 py-7 lg:grid-cols-[390px_1fr]"
    >
      <!-- Controls -->
      <section
        class="no-print h-fit rounded-2xl border border-slate-200 bg-white p-5 shadow-sm lg:sticky lg:top-24"
      >
        <label class="mb-2 block text-sm font-semibold">Date</label>
        <input
          id="dateInput"
          type="date"
          class="mb-5 w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
        />

        <label class="mb-2 block text-sm font-semibold">Title</label>
        <input
          id="titleInput"
          type="text"
          placeholder="IEEE AIUB Student Branch"
          class="mb-5 w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
        />

        <div
          class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-1 xl:grid-cols-2"
        >
          <div>
            <label class="mb-2 block text-sm font-semibold">Time Range</label>
            <input
              id="timeInput"
              type="text"
              placeholder="9:00-10:00"
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
            />
          </div>

          <div>
            <label class="mb-2 block text-sm font-semibold">Name</label>
            <input
              id="nameInput"
              type="text"
              placeholder="Enter name"
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
            />
          </div>

          <div>
            <label class="mb-2 block text-sm font-semibold">ID</label>
            <input
              id="idInput"
              type="text"
              placeholder="Enter ID"
              class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
            />
          </div>
        </div>

        <!-- Button Starts -->
        <!-- =========================================
     ADD & CLEAR BUTTONS
     ========================================= -->

        <div class="mt-3 grid grid-cols-2 gap-3">
          <!-- Add Entry -->
          <button
            id="addBtn"
            class="group relative overflow-hidden rounded-2xl px-4 py-3.5 font-semibold text-white bg-gradient-to-br from-blue-900/80 via-blue-950/80 to-amber-900/40 backdrop-blur-xl shadow-[0_1px_0_rgba(255,255,255,0.25)_inset,0_4px_18px_rgba(10,20,60,0.35)] ring-1 ring-amber-300/30 transition-all duration-200 ease-out hover:brightness-110 hover:shadow-[0_1px_0_rgba(255,255,255,0.3)_inset,0_6px_22px_rgba(10,20,60,0.45)] active:scale-[0.96] active:brightness-95"
          >
            <!-- Top shine -->
            <span
              class="pointer-events-none absolute inset-x-0 top-0 h-1/2 rounded-t-2xl bg-gradient-to-b from-white/25 to-transparent"
            ></span>

            <!-- Hover glow -->
            <span
              class="pointer-events-none absolute -inset-1 bg-gradient-to-tr from-transparent via-amber-200/10 to-amber-200/25 opacity-0 transition-opacity duration-300 group-hover:opacity-100"
            ></span>

            <!-- Button content -->
            <span
              class="relative flex items-center justify-center gap-2 text-[15px] tracking-tight drop-shadow-sm"
            >
              <span class="text-lg leading-none">✙</span>
              <span>Add Entry</span>
            </span>
          </button>

          <!-- Clear All -->
          <button
            id="clearBtn"
            class="group relative overflow-hidden rounded-2xl px-4 py-3.5 font-semibold text-white bg-gradient-to-br from-blue-900/80 via-blue-950/80 to-red-900/40 backdrop-blur-xl shadow-[0_1px_0_rgba(255,255,255,0.25)_inset,0_4px_18px_rgba(10,20,60,0.35)] ring-1 ring-red-300/30 transition-all duration-200 ease-out hover:brightness-110 hover:shadow-[0_1px_0_rgba(255,255,255,0.3)_inset,0_6px_22px_rgba(10,20,60,0.45)] active:scale-[0.96] active:brightness-95"
          >
            <!-- Top shine -->
            <span
              class="pointer-events-none absolute inset-x-0 top-0 h-1/2 rounded-t-2xl bg-gradient-to-b from-white/25 to-transparent"
            ></span>

            <!-- Hover glow -->
            <span
              class="pointer-events-none absolute -inset-1 bg-gradient-to-tr from-transparent via-red-200/10 to-red-200/25 opacity-0 transition-opacity duration-300 group-hover:opacity-100"
            ></span>

            <!-- Button content -->
            <span
              class="relative flex items-center justify-center gap-2 text-[15px] tracking-tight drop-shadow-sm"
            >
              <span class="text-lg leading-none">🗑</span>
              <span>Clear All</span>
            </span>
          </button>
        </div>

        <!-- =========================================
     DOWNLOAD BUTTONS
     ========================================= -->

        <div class="mt-3 grid grid-cols-2 gap-3">
          <!-- Download PDF -->
          <button
            id="downloadBtn"
            class="group relative overflow-hidden rounded-2xl px-4 py-3.5 font-semibold text-white bg-gradient-to-br from-blue-900/80 via-blue-950/80 to-amber-900/40 backdrop-blur-xl shadow-[0_1px_0_rgba(255,255,255,0.25)_inset,0_4px_18px_rgba(10,20,60,0.35)] ring-1 ring-amber-300/30 transition-all duration-200 ease-out hover:brightness-110 hover:shadow-[0_1px_0_rgba(255,255,255,0.3)_inset,0_6px_22px_rgba(10,20,60,0.45)] active:scale-[0.96] active:brightness-95"
          >
            <!-- Top shine -->
            <span
              class="pointer-events-none absolute inset-x-0 top-0 h-1/2 rounded-t-2xl bg-gradient-to-b from-white/25 to-transparent"
            ></span>

            <!-- Hover glow -->
            <span
              class="pointer-events-none absolute -inset-1 bg-gradient-to-tr from-transparent via-amber-200/10 to-amber-200/25 opacity-0 transition-opacity duration-300 group-hover:opacity-100"
            ></span>

            <!-- Button content -->
            <span
              class="relative flex items-center justify-center gap-2 text-[15px] tracking-tight drop-shadow-sm"
            >
              <span class="text-base leading-none">📝</span>
              <span>PDF</span>
            </span>
          </button>

          <!-- Download Word -->
          <button
            id="downloadWordBtn"
            class="group relative overflow-hidden rounded-2xl px-4 py-3.5 font-semibold text-white bg-gradient-to-br from-blue-900/80 via-blue-950/80 to-amber-900/40 backdrop-blur-xl shadow-[0_1px_0_rgba(255,255,255,0.25)_inset,0_4px_18px_rgba(10,20,60,0.35)] ring-1 ring-amber-300/30 transition-all duration-200 ease-out hover:brightness-110 hover:shadow-[0_1px_0_rgba(255,255,255,0.3)_inset,0_6px_22px_rgba(10,20,60,0.45)] active:scale-[0.96] active:brightness-95"
          >
            <!-- Top shine -->
            <span
              class="pointer-events-none absolute inset-x-0 top-0 h-1/2 rounded-t-2xl bg-gradient-to-b from-white/25 to-transparent"
            ></span>

            <!-- Hover glow -->
            <span
              class="pointer-events-none absolute -inset-1 bg-gradient-to-tr from-transparent via-amber-200/10 to-amber-200/25 opacity-0 transition-opacity duration-300 group-hover:opacity-100"
            ></span>

            <!-- Button content -->
            <span
              class="relative flex items-center justify-center gap-2 text-[15px] tracking-tight drop-shadow-sm"
            >
              <span class="text-base leading-none">📄</span>
              <span>Word</span>
            </span>
          </button>
        </div>

        <!-- =========================================
     EVENT VIEW TOGGLE BUTTON
     ========================================= -->

        <div class="mt-3">
          <!-- Toggle Event Preview -->
          <button
            id="eventBtn"
            class="group relative w-full overflow-hidden rounded-2xl px-4 py-3.5 font-semibold text-white shadow-md transition active:scale-[0.98] bg-gradient-to-b from-slate-700 to-slate-900 hover:shadow-lg"
          >
            <!-- Top shine -->
            <span
              class="pointer-events-none absolute inset-x-0 top-0 h-1/2 rounded-t-2xl bg-gradient-to-b from-white/25 to-transparent"
            ></span>

            <!-- Hover glow -->
            <span
              class="pointer-events-none absolute -inset-1 bg-gradient-to-tr from-transparent via-slate-200/10 to-slate-200/25 opacity-0 transition-opacity duration-300 group-hover:opacity-100"
            ></span>

            <!-- Button content -->
            <span
              class="relative flex items-center justify-center gap-2 text-[15px] tracking-tight drop-shadow-sm"
            >
              <span class="text-base leading-none">🎫</span>
              <span id="eventBtnLabel">Event</span>
            </span>
          </button>
        </div>

        <!--  button End -->

        <!-- Error message show -->
        <div
          id="status"
          class="mt-4 hidden rounded-xl px-4 py-3 text-sm font-medium"
        ></div>

        <div class="mt-6 border-t border-slate-200 pt-5">
          <div class="mb-3 flex items-center justify-between">
            <h3 class="font-bold">Entries</h3>
            <span
              id="countBadge"
              class="rounded-full bg-slate-100 px-3 py-1 text-xs font-bold text-slate-600"
              >0 entries</span
            >
          </div>
          <div
            id="entryList"
            class="max-h-[420px] space-y-2 overflow-auto pr-1"
          ></div>
        </div>
      </section>

      <!-- Preview -->
      <section>
        <div class="no-print mb-3 flex items-center justify-between">
          <div>
            <h2 id="previewTitle" class="text-lg font-bold">Live Attendance Preview</h2>
          </div>
        </div>

        >
